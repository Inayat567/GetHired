# fly.toml app configuration file for GetHired
# Refer to https://fly.io/docs/reference/configuration/ for information

app = "gethired"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APP_URL = "https://gethired.innunext.com"
  SQLITE_DB_PATH = "/data/jobs.db"
  PROFILES_DIR = "/data/profiles"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "gethired_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
