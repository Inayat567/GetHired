<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#primaryGrad)" />

  <!-- Subtle grid circuit lines in background -->
  <path d="M20 40 H100 M20 80 H100 M40 20 V100 M80 20 V100" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Orbital Rings / Target Ring -->
  <circle cx="60" cy="58" r="32" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5 4" fill="none" />
  
  <!-- Rocket Exhaust Flame -->
  <path d="M48 76 Q60 102 60 106 Q60 102 72 76 Z" fill="url(#flameGrad)" opacity="0.95" filter="url(#glow)"/>
  <path d="M53 77 Q60 95 60 97 Q60 95 67 77 Z" fill="#FDE047"/>

  <!-- Rocket Fins -->
  <path d="M42 66 L30 76 L44 80 Z" fill="#6366F1" />
  <path d="M78 66 L90 76 L76 80 Z" fill="#6366F1" />

  <!-- Rocket Main Body -->
  <path d="M60 22 C48 36 44 56 46 76 L74 76 C76 56 72 36 60 22 Z" fill="url(#rocketBody)" />

  <!-- Rocket Tip Accent -->
  <path d="M60 22 C56 27 52 34 50 40 L70 40 C68 34 64 27 60 22 Z" fill="#4F46E5" />

  <!-- Rocket Window / AI Iris -->
  <circle cx="60" cy="50" r="8" fill="#1E1B4B" />
  <circle cx="60" cy="50" r="5.5" fill="#38BDF8" />
  <circle cx="58" cy="48" r="2" fill="#FFFFFF" />

  <!-- Dynamic Sparkles / Energy Stars -->
  <path d="M26 30 L28 24 L30 30 L36 32 L30 34 L28 40 L26 34 L20 32 Z" fill="#FACC15" opacity="0.9" />
  <path d="M94 38 L95 34 L96 38 L100 39 L96 40 L95 44 L94 40 L90 39 Z" fill="#FDE047" opacity="0.8" />
</svg>
